name: Tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Verify dependency-free commands
        run: python -S -m unittest discover -s tests -v
      - name: Verify offline website matches source
        run: python scripts/build_web.py --check
      - name: Install optional Excel dependency
        run: python -m pip install -r requirements-excel.txt
      - name: Verify Excel support
        run: python -m unittest discover -s tests -v
